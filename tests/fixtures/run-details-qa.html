<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../extension/style.css"><link rel="stylesheet" href="../../extension/dashboard.css">
<dialog class="metric-details"><header class="metric-dialog-header"><h2>图片</h2><button class="metric-dialog-close" aria-label="关闭">×</button></header><div class="metric-dialog-content"></div></dialog>
<script type="module">
import {renderRunDetails} from '../../extension/run-details.js';
const dialog=document.querySelector('dialog');

dialog.querySelector('button').onclick=()=>dialog.close();dialog.showModal();
</script></html>
