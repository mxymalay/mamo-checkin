name: Windows package
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'
      - 'extension/**'
      - 'tests/windows*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify shared parsing and interface behavior
        run: node --test tests/core.test.js tests/adapters.test.js tests/options-ui.test.js tests/verification.test.js tests/i18n.test.js tests/page-tabs.test.js tests/gmail-session.test.js tests/site-check.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 pillow==11.3.0
      - run: choco install tesseract --version=5.5.0.20241111 --yes --no-progress
      - run: python tests/windows_ocr_test.py
      - run: ./scripts/build-windows.ps1
      - name: Exercise packaged native host
        shell: python
        run: |
          import json, os, pathlib, struct, subprocess, tempfile
          from PIL import Image, ImageDraw, ImageFont
          import base64
          exe = str(pathlib.Path('build/windows/host/mamo-host.exe').resolve())
          with tempfile.TemporaryDirectory(prefix='Mamo test ') as folder:
              env = dict(os.environ, ATTENDANCE_ARCHIVE_DIR=folder)
              image = Image.new('RGB',(1000,43),'#ffe0e0')
              draw=ImageDraw.Draw(image); font=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',20)
              for x,text in [(5,'Seminar'),(365,'Friday, 4 Sep'),(545,'01'),(695,'5:00PM'),(931,'AB123')]: draw.text((x,12),text,font=font,fill='black')
              path = pathlib.Path(folder)/'test.png'; image.save(path)
              meta=dict(course='ABC1234',messageId='fixture',sourceUrl='https://example.edu',sentAt='2026-09-08',subject='Test')
              requests=[dict(op='ping'),dict(op='ocr',mimeType='image/png',imageBase64=base64.b64encode(path.read_bytes()).decode(),meta=meta),dict(op='archive',records=[])]
              data=b''.join(struct.pack('<I',len(b))+b for b in [json.dumps(r).encode() for r in requests])
              run=subprocess.run([exe],input=data,capture_output=True,timeout=90,env=env)
              assert run.returncode == 0, run.stderr
              output=run.stdout; replies=[]
              while output:
                  size=struct.unpack('<I',output[:4])[0]; replies.append(json.loads(output[4:4+size])); output=output[4+size:]
              assert len(replies)==3 and all(r.get('ok') for r in replies), replies
              assert replies[0]['binaryReady'] and replies[0]['engine']=='Tesseract' and replies[0]['ocrRevision']==6, replies[0]
              assert 'AB123' in ' '.join(o['text'] for o in replies[1]['observations']), replies[1]
              assert '01' in [o['text'] for o in replies[1]['observations']], replies[1]
              assert pathlib.Path(replies[2]['archivePath']).exists()
      - name: Exercise installer and Chrome registration
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, winreg
          installer = str(pathlib.Path('build/windows/Install Windows OCR.exe').resolve())
          assert pathlib.Path('build/windows/extension').exists()
          keyname = r'SOFTWARE\Google\Chrome\NativeMessagingHosts\com.attendanceassistant.vision'
          with tempfile.TemporaryDirectory(prefix='Mamo install 中文 ') as folder:
              try:
                  run = subprocess.run([installer], input=b'\n', capture_output=True, timeout=90, env=dict(os.environ, LOCALAPPDATA=folder))
                  assert run.returncode == 0, (run.stdout,run.stderr)
                  with winreg.OpenKey(winreg.HKEY_CURRENT_USER,keyname) as key:
                      manifest = json.loads(pathlib.Path(winreg.QueryValueEx(key,'')[0]).read_text(encoding='utf-8'))
                  assert manifest['allowed_origins']==['chrome-extension://nccgbccaamgcdcikjhljinefjbfcinfp/','chrome-extension://mneachaobiledakoicnkinfdpcjkbnmm/']
                  assert pathlib.Path(manifest['path']).exists() and manifest['path'].startswith(folder)
              finally:
                  try: winreg.DeleteKey(winreg.HKEY_CURRENT_USER,keyname)
                  except FileNotFoundError: pass
      - uses: actions/upload-artifact@v4
        with:
          name: mamo-checkin-windows
          path: |
            build/mamo-checkin-windows.zip
