<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>识别与规则</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="source-rules/style.css"><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="source-rules/practice/wizard.css"></head>
<body><main class="shell modules-shell">
<a id="back-settings" class="back-settings" href="options.html"><span aria-hidden="true">←</span> <span>返回设置</span></a>
<header><img class="brand-icon" src="icons/icon-128.png" width="48" height="48" alt="Mamo Check-in"><h1>识别与规则</h1></header>
<nav class="module-tabs" role="tablist" aria-label="识别与规则">
<button id="module-tab-recognition" type="button" role="tab" data-module-tab="recognition" aria-controls="module-recognition" aria-selected="true">OCR识图方案</button>
<button id="module-tab-library" type="button" role="tab" data-module-tab="library" aria-controls="rule-manager" aria-selected="false" tabindex="-1">规则识别仓库</button>
<button id="module-tab-test" type="button" role="tab" data-module-tab="test" aria-controls="module-test" aria-selected="false" tabindex="-1">规则匹配测试</button>
<button id="module-tab-matching" type="button" role="tab" data-module-tab="matching" aria-controls="rule-bindings" aria-selected="false" tabindex="-1">规则匹配课程</button>
</nav>
<div id="modules-notice" role="status" hidden></div>
<section id="module-recognition" class="recognition-settings modules-section" data-module-panel="recognition" role="tabpanel" aria-labelledby="module-tab-recognition">
<div class="connection"><span class="dot" aria-hidden="true"></span><div><strong id="health" role="status">正在检查识别服务…</strong><p class="muted" id="engine-desc"></p></div></div>
<div class="recognition-actions"><button id="check-health" type="button" class="subtle">检查识别服务</button><button id="prefer-companion" type="button" class="subtle" hidden>安装 Mac 配套程序</button></div>
</section>
<section id="rule-manager" class="modules-section" data-module-panel="library" role="tabpanel" aria-labelledby="module-tab-library" hidden></section>
<section id="rule-bindings" class="modules-section" data-module-panel="matching" role="tabpanel" aria-labelledby="module-tab-matching" hidden></section>
<section id="module-test" class="modules-section" data-module-panel="test" role="tabpanel" aria-labelledby="module-tab-test" hidden><div id="rule-test" hidden></div></section>
<footer>Mamo Check-in · <button id="open-advanced" type="button" aria-controls="rule-test" aria-expanded="false">切换开发者模式</button></footer>
</main><script type="module" src="modules.js"></script></body></html>
